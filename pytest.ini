# Pytest configuration for MIT1002-GEM.
#
# The code lives in code/ (standard-GEM layout). `pythonpath` puts code/ on
# sys.path so tests can `from tools.paths import MODEL_PATH`; `testpaths`
# makes a bare `pytest` from the repo root run just the model tests.
[pytest]
testpaths = code/test
pythonpath = code
