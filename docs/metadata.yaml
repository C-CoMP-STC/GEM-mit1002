# Title block for the PDF build only (docs/build.sh).
#
# This is deliberately NOT YAML front matter inside continuous-curation.md:
# keeping it in its own file means GitHub shows the markdown's own "# ..."
# heading and no metadata table, while the PDF gets the supplement title block.
#
# Markdown works in these fields -- *italics*, and a trailing backslash forces
# a line break.

title: |
  Supplementary Material 1 for:\
  Continuous curation of an *Alteromonas macleodii* metabolic model

# One string rather than a YAML list: a list renders as LaTeX \and, which
# typesets nine authors in side-by-side columns. A single string wraps as a
# paragraph, which is what you want.
author: "Helen Scott, Devlin Moyer, Osnat Weissberg, Franziska Kratzl, Waseem Bashir Valiya Kalladi, Rogier Braakman, Mary Ann Moran, Daniel Sher, Daniel Segrè"

# Uncomment to date the supplement; otherwise the date line is omitted.
# date: "2026-09-21"
